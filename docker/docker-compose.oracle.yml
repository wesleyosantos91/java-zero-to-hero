# Oracle local para a trilha
# Este compose sobe Oracle Free com usuario da aplicacao ja criado.

services:
  oracle-free:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-free-capacitacao
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: app_user
      APP_USER_PASSWORD: app_password
    ports:
      - "1521:1521"
      - "5500:5500"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
